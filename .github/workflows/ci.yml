name: CI

# Quality gate in front of Vercel's auto-deploy. Everything that can be checked
# without a browser is checked here, in cost order: the Go engine's tests are
# the cheapest and most load-bearing signal in the repo, so they run before a
# single npm package is installed.
#
# The two prove scripts are not tests of the code so much as tests of the two
# things only their own runtime can answer: does Postgres accept this SQL, and
# does the parser still turn these eight briefs into the documents it claims.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the toolchain Vercel resolves from the `go` directive in
      # go.mod, so a green run means the deployed function compiles too.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Scoped to our own packages rather than ./... : node_modules ships a
      # stray Go package (flatted) that Go's package matching walks into.
      - name: Go vet
        run: go vet ./engine/... ./api/... ./httpx/... ./cmd/...

      - name: Go test
        run: go test ./engine/... ./api/... ./httpx/... ./cmd/... -count=1

      - name: Go formatting
        run: |
          unformatted="$(gofmt -l ./engine ./api ./httpx ./cmd)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Boots an embedded Postgres, applies the schema, seeds a workspace and
      # runs every hand-written query. It imports lib/db/queries.ts directly
      # rather than restating its SQL, so it cannot pass while the app fails.
      - name: Prove the database
        run: npm run prove:db

      # The parser is deterministic and has no model behind it, so its output
      # can simply be asserted. The engine has to be up: this step also pushes
      # every document the parser produces through the real validator.
      - name: Prove the parser
        run: |
          go run ./cmd/engine &
          for _ in $(seq 1 30); do
            curl -sf -X POST http://127.0.0.1:4310/api/engine \
              -H 'content-type: application/json' -d '{"op":"health"}' >/dev/null && break
            sleep 1
          done
          npm run prove:parser

      - name: Build
        run: npm run build
