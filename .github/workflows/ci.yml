name: CI

# Quality gate in front of Vercel's auto-deploy. Everything that can be checked
# without a browser is checked here, in cost order: the Go engine's tests are
# the cheapest and most load-bearing signal in the repo, so they run before a
# single npm package is installed.
#
# The two prove scripts are not tests of the code so much as tests of the two
# things only their own runtime can answer: does Postgres accept this SQL, and
# does the parser still turn these eight briefs into the documents it claims.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the toolchain Vercel resolves from the `go` directive in
      # go.mod, so a green run means the deployed function compiles too.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Scoped to our own packages rather than ./... : node_modules ships a
      # stray Go package (flatted) that Go's package matching walks into.
      - name: Go vet
        run: go vet ./engine/... ./api/... ./httpx/... ./cmd/...

      - name: Go test
        run: go test ./engine/... ./api/... ./httpx/... ./cmd/... -count=1

      - name: Go formatting
        run: |
          unformatted="$(gofmt -l ./engine ./api ./httpx ./cmd)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      # public/engine.wasm is committed, because the Go toolchain exists during
      # Vercel's build and not inside the running function. A committed binary
      # that nobody checks is a binary that rots.
      #
      # Note what does NOT guard it: a byte comparison against a fresh build.
      # That was the first instinct and it is the wrong one, because the bytes
      # depend on the exact Go patch release, so CI resolving 1.23.6 against a
      # machine holding 1.23.5 would fail a build that is perfectly correct.
      #
      # The guard is behavioural instead. `prove:transports` runs the committed
      # wasm against an HTTP engine compiled from source in this job, so a wasm
      # that is stale in any way that matters answers differently and fails.
      # A stale build that behaves identically on those cases would pass, and
      # that is the honest limit of this check.
      - name: Report the wasm size
        run: |
          echo "committed: $(du -h public/engine.wasm | cut -f1) raw, \
          $(gzip -c public/engine.wasm | wc -c | awk '{printf "%.1fMB", $1/1048576}') gzipped"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Boots an embedded Postgres, applies the schema, seeds a workspace and
      # runs every hand-written query. It imports lib/db/queries.ts directly
      # rather than restating its SQL, so it cannot pass while the app fails.
      - name: Prove the database
        run: npm run prove:db

      # Both remaining proofs need the engine up. The parser proof pushes every
      # document it produces through the real validator; the actions proof is
      # the gate, and the gate is the engine answering.
      - name: Start the engine
        run: |
          go run ./cmd/engine &
          for _ in $(seq 1 30); do
            curl -sf -X POST http://127.0.0.1:4310/api/engine \
              -H 'content-type: application/json' -d '{"op":"health"}' >/dev/null && break
            sleep 1
          done

      - name: Prove the parser
        run: npm run prove:parser

      # The load-bearing claim of the whole demo: the invoice is unreachable
      # until the contract is signed. Driven through the real functions the
      # server actions call, against a real database, checking the tables rather
      # than the return value.
      - name: Prove the gate
        run: npm run prove:actions

      # One Go package, two ways to reach it. "We compiled the same source" is a
      # claim about the build; this is a claim about the answers.
      - name: Prove the transports agree
        run: npm run prove:transports

      # And the gate again, forced through HTTP. It runs on WASM by default, so
      # without this the deployed function's path is never exercised by a test.
      - name: Prove the gate over HTTP too
        run: ENGINE_MODE=http npm run prove:actions

      - name: Build
        run: npm run build
